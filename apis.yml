name: Auxilius
description: 'Auxilius is R&D finance automation software for biopharmaceutical companies,
  purpose-built to manage clinical trial finances. The platform automates clinical
  expense accruals and financial close with built-in audit controls, tracks investigator
  grant spend by mapping patient-visit data to site contracts, and models and re-forecasts
  study spend as trial conditions change. It integrates with clinical (Medrio, Veeva),
  financial (Oracle NetSuite, Workday, SAP, QuickBooks), procurement (Coupa, Bill.com),
  and planning (Planful, Anaplan) systems, delivering variance analysis, automated
  reconciliation, and audit-ready role-based approval workflows. Auxilius is SOC 1
  Type 2 and SOC 2 Type 2 compliant and is used by 100+ biopharma companies. It is
  backed by Bain Capital Ventures. No public developer API is currently published.'
